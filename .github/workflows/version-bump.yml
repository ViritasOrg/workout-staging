name: Version Bump

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "github.actor != 'github-actions[bot]'"
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Wait for pages build to start
        run: sleep 10

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        run: |
          CURRENT=$(jq -r '.version' version.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW="${MAJOR}.$((MINOR + 1))"

          echo "{\"version\": \"${NEW}\"}" > version.json
          sed -i "s/const VERSION='[0-9.]*'/const VERSION='${NEW}'/" index.html

          echo "NEW=${NEW}" >> $GITHUB_ENV

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="version-bump/v${NEW}"
          git push origin --delete "$BRANCH" || true
          git checkout -b "$BRANCH"
          git add version.json index.html
          git commit -m "chore: bump to v${NEW}"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump to v${NEW}" \
            --body "Auto-generated version bump. Merges automatically once CI passes.")
          # --delete-branch only takes effect if this call merges the PR itself. With
          # --auto it does NOT: auto-merge is merely requested here and lands after
          # this workflow exits. Verified on the v1.196 run — PR merged, branch
          # survived. The "Prune superseded bump branches" step below is what
          # actually clears them; the flag is kept for the case where the PR is
          # mergeable immediately.
          gh pr merge --auto --squash --delete-branch "$PR_URL"

      - name: Rerun blocked CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN pushes don't trigger downstream workflows (loop prevention).
          # Bot-authored PRs land with conclusion=action_required immediately.
          # Poll for the run, then /rerun it — the test job is skipped by its own
          # if-condition (github.actor != 'github-actions[bot]'), satisfying required
          # checks so auto-merge can fire. /approve only works for fork PRs (HTTP 403
          # on same-repo PRs); /rerun is the correct endpoint here.
          for i in $(seq 1 12); do
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?event=pull_request&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_branch == \"$BRANCH\" and .conclusion == \"action_required\")] | .[0].id")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              if gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun"; then
                echo "Rerun requested for CI run $RUN_ID after $i attempts"
              else
                echo "Rerun call failed — CI may have already run or been skipped"
              fi
              exit 0
            fi
            echo "Attempt $i: no action_required run found yet, waiting 5s..."
            sleep 5
          done
          echo "No action_required run found after 60s — CI may have run normally"

      - name: Prune superseded bump branches
        run: |
          # Every version-bump/* branch except the one this run just created is from
          # an earlier version: it either merged (its commit is in main) or was
          # superseded by a later bump. Nothing but a version bump is ever stored on
          # these branches, so both cases are safe to delete.
          #
          # This is why --delete-branch cannot do the job on the auto path:
          # `gh pr merge --auto` only REQUESTS auto-merge. The merge lands after this
          # workflow has already exited, and the auto-merge mutation carries no
          # branch-deletion option — so the branch survives. Pruning at the start of
          # the NEXT run is what actually keeps the list clean.
          mapfile -t stale < <(git ls-remote --heads origin 'refs/heads/version-bump/*' \
            | sed 's|.*refs/heads/||' | grep -vxF "$BRANCH" || true)
          echo "${#stale[@]} superseded bump branch(es) to remove"
          for ((i=0; i<${#stale[@]}; i+=50)); do
            git push origin --delete "${stale[@]:i:50}" || true
          done
